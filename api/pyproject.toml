[project]
name = "tallied-api"
version = "0.1.0"
description = "Tallied API: checks whether a tenant's bank statements and payslips add up."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "anthropic>=2.8.0",
    "pdfplumber>=0.11.10",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "pillow>=13.0.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    # Used by fixtures/generate.py and the fixture tests only.
    "reportlab>=4.2",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live_ai: calls the real Claude API (needs ANTHROPIC_API_KEY)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
